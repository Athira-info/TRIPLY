<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triply - Saved</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="saved.css">

</head>


<body>


<div class="app-container">


    <!-- HEADER -->

    <header class="top-header">

        <div>

            <span class="page-label">
                YOUR COLLECTION
            </span>

            <h1>Saved</h1>

        </div>


        <div class="saved-count">

            <i class="fa-solid fa-heart"></i>

            <span id="savedCount">0</span>

        </div>

    </header>



    <!-- CATEGORY FILTER -->

    <div class="category-tabs">

        <button
            class="category-tab active"
            data-category="all"
        >
            All
        </button>

        <button
            class="category-tab"
            data-category="beach"
        >
            Beach
        </button>

        <button
            class="category-tab"
            data-category="mountains"
        >
            Mountains
        </button>

        <button
            class="category-tab"
            data-category="city"
        >
            City
        </button>

        <button
            class="category-tab"
            data-category="adventure"
        >
            Adventure
        </button>

    </div>



    <!-- SAVED DESTINATIONS -->

    <main class="content">

        <div
            class="saved-grid"
            id="savedGrid"
        >

            <!-- Cards generated by JavaScript -->

        </div>

    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="explore.html" class="nav-item">
        <i class="fa-solid fa-compass"></i>
        <span>Explore</span>
    </a>

    <a href="my-trips.html" class="nav-item">
        <i class="fa-solid fa-suitcase-rolling"></i>
        <span>Trips</span>
    </a>

    <a href="saved.html" class="nav-item active">
        <i class="fa-regular fa-heart"></i>
        <span>Saved</span>
    </a>

    <a href="profile.html" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>


</div>


<script src="saved.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triply - My Trips</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="my-trips.css">

</head>


<body>


<div class="app-container">


    <!-- HEADER -->

    <header class="top-header">

        <div>

            <span class="page-label">
                YOUR JOURNEYS
            </span>

            <h1>My Trips</h1>

        </div>


        <button class="add-btn" id="addTripBtn">

            <i class="fa-solid fa-plus"></i>

        </button>

    </header>



    <!-- TRIP FILTER -->

    <div class="trip-filters">

        <button
            class="filter-chip active"
            data-filter="all"
        >
            All
        </button>

        <button
            class="filter-chip"
            data-filter="upcoming"
        >
            Upcoming
        </button>

        <button
            class="filter-chip"
            data-filter="past"
        >
            Past
        </button>

    </div>



    <!-- TRIPS -->

    <main class="content">

        <section id="tripsContainer">

            <!-- Trips generated by JavaScript -->

        </section>

    </main>



    <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="explore.html" class="nav-item">
        <i class="fa-solid fa-compass"></i>
        <span>Explore</span>
    </a>

    <a href="my-trips.html" class="nav-item active">
        <i class="fa-solid fa-suitcase-rolling"></i>
        <span>Trips</span>
    </a>

    <a href="saved.html" class="nav-item">
        <i class="fa-regular fa-heart"></i>
        <span>Saved</span>
    </a>

    <a href="profile.html" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>


</div>


<script src="my-trips.js"></script>

</body>

</html>
